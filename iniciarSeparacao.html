<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta name="description" content="">
    <meta name="author" content="">

    <title>Marvin</title>

    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <!-- Custom fonts for this template-->
    <link href="vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link
        href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <!-- Custom styles for this template-->
    <link href="css/sb-admin-2.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/gerenciarSeparacao.css">

</head>

<body id="page-top">

    <!-- Page Wrapper -->
    <div id="wrapper">

        <!-- Sidebar -->
        <ul class="navbar-nav bg-gradient-primary sidebar sidebar-dark accordion" id="accordionSidebar">

        </ul>
        <!-- End of Sidebar -->

        <!-- Content Wrapper -->
        <div id="content-wrapper" class="d-flex flex-column">

            <!-- Main Content -->
            <div id="content">

                <!-- Topbar -->
                <nav class="navbar navbar-expand navbar-light bg-white topbar mb-4 static-top shadow">

                    <!-- Sidebar Toggle (Topbar) -->
                    <button id="sidebarToggleTop" class="btn btn-link d-md-none rounded-circle mr-3">
                        <i class="fa fa-bars"></i>
                    </button>

                    <!-- Topbar Search -->
                    <form
                        class="d-none d-sm-inline-block form-inline mr-auto ml-md-3 my-2 my-md-0 mw-100 navbar-search">
                        <div class="input-group">
                            <input type="text" class="form-control bg-light border-0 small"
                                placeholder="Pesquisar por..." aria-label="Search" aria-describedby="basic-addon2">
                            <div class="input-group-append">
                                <button class="btn btn-primary" type="button">
                                    <i class="fas fa-search fa-sm"></i>
                                </button>
                            </div>
                        </div>
                    </form>

                    <!-- Topbar Navbar -->
                    <ul class="navbar-nav ml-auto">

                        <!-- Nav Item - Search Dropdown (Visible Only XS) -->
                        <li class="nav-item dropdown no-arrow d-sm-none">
                            <a class="nav-link dropdown-toggle" href="#" id="searchDropdown" role="button"
                                data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                                <i class="fas fa-search fa-fw"></i>
                            </a>
                            <!-- Dropdown - Messages -->
                            <div class="dropdown-menu dropdown-menu-right p-3 shadow animated--grow-in"
                                aria-labelledby="searchDropdown">
                                <form class="form-inline mr-auto w-100 navbar-search">
                                    <div class="input-group">
                                        <input type="text" class="form-control bg-light border-0 small"
                                            placeholder="Pesquisar por..." aria-label="Search"
                                            aria-describedby="basic-addon2">
                                        <div class="input-group-append">
                                            <button class="btn btn-primary" type="button">
                                                <i class="fas fa-search fa-sm"></i>
                                            </button>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </li>

                        <div class="topbar-divider d-none d-sm-block"></div>

                        <!-- Nav Item - User Information -->
                        <li class="nav-item dropdown no-arrow" id="navPerfil">

                        </li>

                    </ul>

                </nav>
                <!-- End of Topbar -->

                <!-- Begin Page Content -->
                <div class="container-fluid p-0">

                    <!-- Page Heading -->
                    <div class="d-sm-flex align-items-center justify-content-between mb-4">
                        <h1 class="h3 mb-0 text-gray-800">Iniciar Separação</h1>
                        <label for="arquivoExcel" class="btn btn-primary">
                            📂 Importar planilha
                        </label>

                        <input type="file" id="arquivoExcel" accept=".xlsx,.xls,.csv" hidden>

                    </div>

                    <!-- Content Row -->
                    <div class="row">
                        <header class="topbar w-100">
                            <div>
                                <h1>Produtos</h1>
                                <span id="contador">0 registros</span>
                            </div>
                        </header>

                        <div class="container">
                            <div class="row">
                                <div class="col-12">
                                    <select class="form-select text-center" id="SelectCidade">
                                        <option value="" class="bg-white text-black">Selecione uma loja</option>
                                        <option value="caraguatatuba" class="bg-danger text-white">Caraguatatuba
                                        </option>
                                        <option value="SaoSeba" class="bg-warning">São Sebastião</option>
                                        <option value="maranduba" class="bg-primary text-white">Maranduba</option>
                                        <option value="parafusos" class="bg-info">Parafusos</option>
                                        <option value="teste" class="bg-secondary text-white">TESTE</option>
                                    </select>
                                </div>
                            </div>
                        </div>


                        <main class="container p-1">

                            <div class="painel">

                                <div class="filtros">

                                    <input type="text" id="pesquisa"
                                        placeholder="Pesquisar produto, descrição, marca...">

                                    <select id="filtroFolha">

                                        <option value="">Todas as folhas</option>

                                        <option value="1">Folha 1</option>
                                        <option value="1,1">Folha 1,1</option>

                                        <option value="2">Folha 2</option>
                                        <option value="2,1">Folha 2,1</option>

                                        <option value="3">Folha 3</option>
                                        <option value="3,1">Folha 3,1</option>

                                        <option value="4">Folha 4</option>
                                        <option value="4,1">Folha 4,1</option>

                                        <option value="5">Folha 5</option>
                                        <option value="5,1">Folha 5,1</option>
                                        <option value="6">Folha 6</option>
                                    </select>

                                </div>


                                <div class="info">

                                    <span>
                                        Registros exibidos:
                                        <strong id="registrosExibidos">0</strong>
                                    </span>

                                    <span>
                                        Folhas encontradas:
                                        <strong id="folhasEncontradas">0</strong>
                                    </span>

                                </div>


                                <div class="table-responsive w-100">
                                    <table class="table table-hover w-100">
                                        <thead>
                                            <tr>
                                                <th>Pedido</th>
                                                <th>Produto</th>
                                                <th>Descrição</th>
                                                <th>Identificação</th>
                                                <th>Marca</th>
                                                <th>Local</th>
                                                <th>Quantidade</th>
                                                <th>Folha</th>
                                            </tr>

                                        </thead>

                                        <tbody id="tabelaProdutos">

                                        </tbody>

                                    </table>

                                </div>


                                <div id="mensagemVazia" class="mensagem-vazia">
                                    Importe uma planilha para começar.
                                </div>

                            </div>

                            <div class="row mt-3">
                                <div class="col-12 text-end">
                                    <button class="btn btn-info w-50" id="btnEnviarPedidoSeparacao">Enviar pedido para
                                        separação</button>
                                </div>
                            </div>

                        </main>
                    </div>
                </div>

            </div>
            <!-- End of Main Content -->

            <!-- Footer -->
            <footer class="sticky-footer bg-white">
                <div class="container my-auto">
                    <div class="copyright text-center my-auto">
                        <span>Copyright &copy; Marvin 2026</span>
                    </div>
                </div>
            </footer>
            <!-- End of Footer -->

        </div>
        <!-- End of Content Wrapper -->

    </div>
    <!-- End of Page Wrapper -->

    <!-- Scroll to Top Button-->
    <a class="scroll-to-top rounded" href="#page-top">
        <i class="fas fa-angle-up"></i>
    </a>
    <!-- Bootstrap core JavaScript-->
    <script src="vendor/jquery/jquery.min.js"></script>
    <script src="vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <!-- Core plugin JavaScript-->
    <script src="vendor/jquery-easing/jquery.easing.min.js"></script>

    <!-- Custom scripts for all pages-->
    <script src="js/sb-admin-2-script.js" type="module"></script>
    <script src="js/sb-admin-2.min.js"></script>

    <!-- Page level plugins -->
    <script src="vendor/chart.js/Chart.min.js"></script>

    <!-- Page level custom scripts -->
    <script src="js/demo/chart-area-demo.js"></script>
    <script src="js/demo/chart-pie-demo.js"></script>

    <!-- javaScript iniciarSeparacao -->
    <script src="js/iniciarSeparacao.js" type="module"></script>

</body>

</html>
